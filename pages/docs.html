<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Documentation - PhantomWire</title>
  <meta name="description" content="Technical documentation for PhantomWire plugins and tools."/>
  <link rel="stylesheet" href="../style.css"/>
  <link rel="icon" type="image/x-icon" href="/assets/icons/favicon.ico"/>
  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg"/>
  <meta property="og:type" content="website"/>
  <meta property="og:title" content="Documentation - PhantomWire"/>
  <meta property="og:description" content="Technical documentation for PhantomWire plugins and tools."/>
  <meta property="og:image" content="https://phantomwiregames.github.io/assets/images/PFP.png"/>
  <style>
    .docs-layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 0;
      min-height: calc(100vh - var(--nav-h));
    }
    .docs-sidebar {
      background: var(--pw-dark-2);
      border-right: 1px solid rgba(255,255,255,0.06);
      padding: 40px 0;
      position: sticky;
      top: var(--nav-h);
      height: calc(100vh - var(--nav-h));
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .docs-sidebar-label {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--pw-grey);
      padding: 0 24px 12px;
    }
    .docs-sidebar-item {
      display: block;
      padding: 10px 24px;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 600;
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--pw-white-dim);
      text-decoration: none;
      border-left: 2px solid transparent;
      transition: all 0.2s;
      cursor: pointer;
      background: none;
      border-top: none;
      border-right: none;
      border-bottom: none;
      width: 100%;
      text-align: left;
    }
    .docs-sidebar-item:hover { color: var(--pw-white); background: var(--pw-dark-3); }
    .docs-sidebar-item.active { color: var(--pw-pink); border-left-color: var(--pw-pink); background: rgba(225,22,120,0.06); }
    .docs-iframe-wrap {
      position: relative;
      width: 100%;
      height: calc(100vh - var(--nav-h));
      overflow: hidden;
    }
    .docs-iframe-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    @media (max-width: 900px) {
      .docs-layout { grid-template-columns: 1fr; }
      .docs-sidebar { position: static; height: auto; overflow-x: auto; padding: 16px 0; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.06); }
      .docs-iframe-wrap { height: 80vh; }
    }
  </style>
</head>
<body data-page="docs">

<div id="nav-placeholder"></div>

<div class="docs-layout">
  <nav class="docs-sidebar">
    <div>
      <div class="docs-sidebar-label">Plugins</div>
      <button class="docs-sidebar-item active" data-slug="movercoversystem" onclick="loadDocs('movercoversystem', this)">Mover Cover System</button>
      <button class="docs-sidebar-item" data-slug="easyiconfont" onclick="loadDocs('easyiconfont', this)">Easy Icon Font</button>
    </div>
    <div style="margin-top:auto;">
      <div class="docs-sidebar-label">Tools</div>
      <a class="docs-sidebar-item" href="/pages/sc1-profile-editor.html" target="_blank">SC1 Profile Editor ↗</a>
    </div>
  </nav>

  <div class="docs-iframe-wrap">
    <iframe
      id="docs-iframe"
      name="docs-iframe"
      src="/pages/docs/movercoversystem/index.html"
      title="MoverCoverSystem Documentation"
      sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-top-navigation allow-popups-to-escape-sandbox"
    ></iframe>
  </div>
</div>

<script src="../shared.js"></script>
<script>
function loadDocs(slug, btn) {
  document.querySelectorAll('.docs-sidebar-item').forEach(function(b) {
    b.classList.remove('active');
  });
  btn.classList.add('active');
  document.getElementById('docs-iframe').src = '/pages/docs/' + slug + '/index.html';
  var url = new URL(window.location.href);
  url.searchParams.set('doc', slug);
  history.replaceState(null, '', url);
}

(function initDocFromUrl() {
  var slug = new URLSearchParams(window.location.search).get('doc');
  if (!slug) return;
  var btn = document.querySelector('.docs-sidebar-item[data-slug="' + slug + '"]');
  if (btn) loadDocs(slug, btn);
})();
</script>
</body>
</html>
